<nav class="navbar navbar-expand-lg navbar-light">
  <div class="container-fluid">
    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
      aria-controls="offcanvasNavbar">
      <i class="fa-solid fa-bars"></i>
    </button>
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Y R Reddy Group</h5>
        <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body">
        <img src="../../assets/favicon.png" alt="logo" class="logo">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item" [ngClass]="{'active': isActive('/construction')}" (click)="closeOffcanvas()">
            <a routerLink="/construction" routerLinkActive="active">
              <img [src]="getImageSource('/construction')" alt="Construction">
              <span class="nav-link">Construction</span>
            </a>
          </li>
          <li class="nav-item" [ngClass]="{'active': isActive('/interior')}" (click)="closeOffcanvas()">
            <a routerLink="/interior" routerLinkActive="active">
              <img [src]="getImageSource('/interior')" alt="Interior">
              <span class="nav-link">Interior</span>
            </a>
          </li>
          <li class="nav-item" [ngClass]="{'active': isActive('/medical')}" (click)="closeOffcanvas()">
            <a routerLink="/medical" routerLinkActive="active">
              <img [src]="getImageSource('/medical')" alt="Medical">
              <span class="nav-link">Medical</span>
            </a>
          </li>
          <li class="nav-item" [ngClass]="{'active': isActive('/farms')}" (click)="closeOffcanvas()">
            <a routerLink="/farms" routerLinkActive="active">
              <img [src]="getImageSource('/farms')" alt="Farms">
              <span class="nav-link">Farms</span>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>
